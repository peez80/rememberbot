services:
  web:
    build:
      context: .
      target: test
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./_rememberbot_data:/app/data
      - ~/.gemini/antigravity-cli:/root/.gemini/antigravity-cli
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=${DATA_DIR:-/app/data}
      - USER_BACKEND=${USER_BACKEND:-json}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - AGY_DEFAULT_MODEL=${AGY_DEFAULT_MODEL:-gemini-3.8-flash}
      - AGY_DEFAULT_THINKING_EFFORT=${AGY_DEFAULT_THINKING_EFFORT:-medium}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_ISSUER_URL=${OAUTH_ISSUER_URL:-}
      - OAUTH_DISCOVERY_URL=${OAUTH_DISCOVERY_URL:-}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-}
      - OAUTH_AUTHORIZE_URL=${OAUTH_AUTHORIZE_URL:-}
      - OAUTH_TOKEN_URL=${OAUTH_TOKEN_URL:-}
      - OAUTH_USERINFO_URL=${OAUTH_USERINFO_URL:-}
      - OAUTH_SCOPE=${OAUTH_SCOPE:-openid profile email}
      - OAUTH_USERNAME_CLAIM=${OAUTH_USERNAME_CLAIM:-preferred_username}
      - OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME:-SSO}
