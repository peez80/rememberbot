services:
  web:
    build:
      context: .
      target: test
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./_rememberbot_data:/app/data
      - ~/.gemini/antigravity-cli:/root/.gemini/antigravity-cli
    environment:
      - DATA_DIR=/app/data
      - LOG_LEVEL=DEBUG
      - AGY_DEFAULT_MODEL=gemini-3.8-flash
      - AGY_DEFAULT_THINKING_EFFORT=medium
volumes:
  rememberbot_data:
