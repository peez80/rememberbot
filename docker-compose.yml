services:
  web:
    build:
      context: .
      target: test
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./_rememberbot_data:/app/data
      - ~/.gemini/antigravity-cli:/root/.gemini/antigravity-cli
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=${DATA_DIR:-/app/data}
      - USER_BACKEND=${USER_BACKEND:-json}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - AGY_DEFAULT_MODEL=${AGY_DEFAULT_MODEL:-gemini-3.8-flash}
      - AGY_DEFAULT_THINKING_EFFORT=${AGY_DEFAULT_THINKING_EFFORT:-medium}
